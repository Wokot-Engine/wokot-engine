name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: repo-sync
      uses: repo-sync/github-sync@v2
      with:
        source_repo: "https://github.com/godotengine/godot.git"
        source_branch: "master"
        destination_branch: "upstream"
        sync_tags: ""
        github_token: ${{ secrets.PAT }}
    - name: create PR
      run: gh pr create -B wokot -H upstream --title 'Merge upstream' --body 'Sync the `wokot` branch to the latest Godot Engine commit.'
      env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
